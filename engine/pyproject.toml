[project]
name = "wf-engine"
version = "0.1.0"
description = "Workspace Funcional - motor simbolico (Python puro, sin dependencias web)"
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.12",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wf_core", "wf_statics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
