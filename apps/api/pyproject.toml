[project]
name = "wf-api"
version = "0.1.0"
description = "Workspace Funcional - capa HTTP sobre el motor simbolico"
requires-python = ">=3.11"
dependencies = [
    "wf-engine",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wf_api"]

[tool.uv.sources]
wf-engine = { path = "../../engine", editable = true }
